    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

Kodeklubben Lørenskog arrangerer gratis kodeklubb-kvelder to gang i måneden! Dette er tilpasset for barn og unge mellom 10 og 16 år. Vi som arrangerer kodeklubben gjør dette helt frivillig og vi får ingen økonomisk støtte fra noen. Biblioteket i Lørenskog får vi lov å bruke gratis. Vi liker å kode og vi vil gjerne lære bort litt til barn og unge. Foreldre er selvfølgelig også hjertelig velkomne og kan også gjerne hjelpe barna litt hvis det trengs. I kodeklubben kan man lære litt om koding og samtidig ha det gøy med det du lærer. Noen barn og unge lærer koding veldig raskt og kan mye fra før. Det er også gøy å finne opp din egen kode og se at den fungerer! 

Vi har dessverre ikke så mange PC'er til utlån, så det er bra å ha med egen PC eller nettbrett. Men vi har fått en del micro:bits og robotbiler fra Lær Kidsa Koding. Vi låner dem ut slik at alle kan prøve ut kodene og se at det fungerer i praksis selv. Det er ikke nødvendig å bruke spesielle programmer eller annet utstyr og det er ikke nødvendig å kunne koding fra før.

Vi legger ut informasjon om arrangementene i Spond hvor du også kan melde deg på. Her er lenke til dette:

https://spond.com/invite/DOCPH

Skoleåret 2026/2027 vil kodeklubben arrangere kodekvelder i Lørenskog bibliotek ca to ganger i måneden fra kl 18 til kl 19:30. Onsdagene vil spesielt være tilpasset nybegynnere og det blir mye blokkbasert programmering og vi bruker da for eksempel MakeCode for å kode med blokker. På torsdager vil vil prøve oss på litt mer avansert koding for de som ønsker det. Da vil vi bruke mer tekstbasert programmering, som for eksempel Python. Følgende datoer er planlagt for kodeklubben dette skoleåret:

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: true,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom
            plugins: [

                RevealHighlight,
                RevealZoom,
                RevealNotes,
                RevealMath.KaTeX,
                RevealMermaid,
                RevealChart,

                RevealPointer,
                RevealChalkboard,
                ElapsedTimeBar
            ],
            allottedTime: "120",

            katex: {
                local: 'plugin/math/katex',
                extensions: ["mhchem"],
            },
            markdown: {
                gfm: true,
            },
            mermaid: {
                theme: isLight(bgColor) ? 'default' : 'dark',
            },
            customcontrols: {
                controls: [
                    {
                        id: 'toggle-overview',
                        title: 'Toggle overview (O)',
                        icon: '<i class="fa fa-th"></i>',
                        action: 'Reveal.toggleOverview();'
                    },
                    {
                        icon: '<i class="fa fa-pen-square"></i>',

        };

        if ( pageInIframe() ) {

        const options = extend(defaultOptions, {"controls":true,"progress":true,"slideNumber":true,"center":true,"transition":"slide","transitionSpeed":"default","width":960,"height":700,"margin":0.04}, queryOptions);
    </script>
